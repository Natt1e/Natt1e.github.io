# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
# TODO: Replace "Natt1e" with your preferred full name when ready.
title                    : "HongYue Yu"
# TODO: Replace this with one sentence describing your current position and research focus.
description              : "Focusing on automatic software engineering"
repository               : "Natt1e/Natt1e.github.io"
url                      : "https://natt1e.github.io"
baseurl                  : ""
google_scholar_stats_use_cdn : true

# google analytics
